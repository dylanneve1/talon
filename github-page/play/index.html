<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>play</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08090b;
        color: #e7e5e4;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid #ffffff14;
        font-size: 13px;
        color: #8b8b93;
      }
      header b {
        color: #f472b6;
        font-weight: 600;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        min-height: 0;
      }
      video {
        width: 100%;
        height: 100%;
        max-height: 100%;
        background: #000;
        display: block;
      }
      .msg {
        max-width: 34rem;
        padding: 2rem 1.25rem;
        text-align: center;
      }
      .msg h1 {
        font-size: 1.05rem;
        margin: 0 0 0.6rem;
      }
      .msg p {
        color: #8b8b93;
        margin: 0.4rem 0;
      }
      .msg code {
        background: #ffffff10;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        font-size: 12px;
        word-break: break-all;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-top: 1.2rem;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 0.6rem 0.7rem;
        border-radius: 8px;
        border: 1px solid #ffffff20;
        background: #ffffff08;
        color: inherit;
        font-size: 13px;
      }
      button {
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
        background: #db2777;
        color: #fff;
        font-weight: 600;
        font-size: 13px;
      }
      footer {
        padding: 0.55rem 1rem;
        border-top: 1px solid #ffffff14;
        font-size: 12px;
        color: #6b6b73;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      footer a {
        color: #8b8b93;
      }
    </style>
  </head>
  <body>
    <header><b>play</b><span id="name"></span></header>
    <main id="main"></main>
    <footer>
      <span
        >direct-navigation CSP bypass &mdash; the file is fetched as a media
        subresource, so its <code>sandbox</code> policy never applies</span
      >
      <a id="dl" hidden download>download</a>
    </footer>
    <script>
      (function () {
        var ALLOWED = [
          "stusercontent.com",
          "storage.to",
          "litter.catbox.moe",
          "files.catbox.moe",
        ];
        var main = document.getElementById("main");

        function param(k) {
          var q = new URLSearchParams(location.search);
          if (q.get(k)) return q.get(k);
          var h = new URLSearchParams(location.hash.replace(/^#/, ""));
          return h.get(k) || "";
        }

        function extractFromPath() {
          var parts = location.pathname.split("/");
          if (parts.length < 2) return "";
          var rest = parts.slice(1).join("/");
          try {
            var decoded = decodeURIComponent(rest);
            if (decoded.match(/^https?:\/\//)) return decoded;
          } catch (e) {}
          return "";
        }

        function fail(title, detail) {
          var d = document.createElement("div");
          d.className = "msg";
          var h = document.createElement("h1");
          h.textContent = title;
          d.appendChild(h);
          if (detail) {
            var p = document.createElement("p");
            p.textContent = detail;
            d.appendChild(p);
          }
          var f = document.createElement("form");
          var i = document.createElement("input");
          i.placeholder = "paste a storage.to link";
          i.name = "u";
          var b = document.createElement("button");
          b.textContent = "Play";
          f.appendChild(i);
          f.appendChild(b);
          f.onsubmit = function (e) {
            e.preventDefault();
            location.search = "?u=" + encodeURIComponent(i.value.trim());
          };
          d.appendChild(f);
          main.innerHTML = "";
          main.appendChild(d);
        }

        var raw = param("u") || extractFromPath();
        if (!raw)
          return fail("No media URL", "Append ?u=<url> — or paste one below.");

        var url;
        try {
          url = new URL(raw);
        } catch (e) {
          return fail("Not a valid URL", raw.slice(0, 200));
        }
        if (url.protocol !== "https:") return fail("https only", url.protocol);
        var host = url.hostname.toLowerCase();
        var ok = ALLOWED.some(function (h) {
          return host === h || host.endsWith("." + h);
        });
        if (!ok)
          return fail(
            "Host not allowed",
            host + " — allowed: " + ALLOWED.join(", "),
          );

        var v = document.createElement("video");
        v.controls = true;
        v.autoplay = true;
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.preload = "metadata";
        v.src = url.href;
        v.onerror = function () {
          fail(
            "The browser refused to play it",
            "Signed links expire — if this one is stale, fetch a fresh link from the file page.",
          );
        };
        main.appendChild(v);

        var name = decodeURIComponent(url.pathname.split("/").pop() || "");
        document.getElementById("name").textContent = name ? "· " + name : "";
        var dl = document.getElementById("dl");
        dl.href = url.href;
        dl.hidden = false;
      })();
    </script>
  </body>
</html>
