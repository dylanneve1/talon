name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── PR title must be a conventional commit ────────────────────
  # Squash merges use the PR title as the commit subject, and
  # release-please only counts typed commits (feat/fix/…) towards a
  # release. A typeless title merges fine but silently produces NO
  # release — exactly what happened with #521 ("macOS DMG install
  # UX + …"). Gate it here so the mistake can't reach main.
  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate conventional-commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          regex='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([^)]+\))?!?: .+'
          if [[ "$TITLE" =~ $regex ]]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title is not a conventional commit: '$TITLE'"
            echo "::error::Squash merges use the PR title as the commit subject; release-please needs a type (feat:/fix:/chore:/…) or the merge produces no release."
            exit 1
          fi

  # ── Lint, format, and type-check ──────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries (dependency-cruiser)
        run: npm run depcruise

      - name: Ratchet gates
        run: npm run ratchets

      - name: Check for .only/.skip in tests
        run: |
          if grep -rn '\.only\s*(' --include='*.test.ts' src/__tests__/ || \
             grep -rn '\.skip\s*(' --include='*.test.ts' src/__tests__/; then
            echo "::error::Found .only() or .skip() in test files — remove before merging"
            exit 1
          fi

      - name: Dead code analysis (informational)
        run: npm run knip -- --no-exit-code
        continue-on-error: true

      - name: Format check
        run: npm run format:check

  # ── Unit & integration tests + coverage ────────────────────────
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # One ubuntu run WITH coverage — instrumentation overhead is
          # noise the macOS/Windows legs already absorb, and a second
          # uninstrumented ubuntu leg just ran the same suite twice.
          - os: ubuntu-latest
            node-version: 24
            coverage: true
          - os: macos-latest
            node-version: 24
            coverage: false
          - os: windows-latest
            node-version: 24
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: npm run test:ci

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: npx vitest run --coverage --reporter=verbose --reporter=json --outputFile=test-results.json

      - name: Test summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs test-results.json "Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})" coverage/coverage-summary.json

      - name: Validate coverage report
        if: ${{ matrix.coverage }}
        run: |
          node -e "if (!require('fs').existsSync('coverage/coverage-summary.json')) { console.error('Coverage report not generated'); process.exit(1); }"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: test-results.json
          retention-days: 14

      - name: Upload coverage
        if: always() && matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Cross-platform functional tests (subprocess spawn/teardown) ───────
  # The MCP launcher relies on pipe-EOF-on-parent-death being a kernel
  # guarantee on every OS Node supports. Validate that on Windows and macOS
  # as well as Linux so we catch platform regressions before they hit users.
  functional-cross-platform:
    name: Functional (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Stub claude SEA build — only required on Windows (where Node 20.19+
      # CVE-2024-27980 blocks spawning .cmd shims via child_process.spawn).
      # POSIX uses the .mjs directly via shebang and skips the build.
      - name: Build stub claude SEA binary (Windows)
        if: runner.os == 'Windows'
        run: npm run build:stub-sea

      - name: Run cross-platform functional tests
        run: npm run test:functional

      - name: Functional summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs functional-results.json "Functional (${{ matrix.os }})"

      - name: Upload functional results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-results-${{ matrix.os }}
          path: functional-results.json
          retention-days: 14

  # ── MCP-functional integration tier ───────────────────────────
  # Drives a full Talon turn through the stub `claude` binary, real MCP
  # subprocess + JSON-RPC, real Gateway, real bridge HTTP, and a recording
  # action handler. This is the tier that catches SDK→MCP→bridge→handler
  # integration bugs (e.g. PR #122's prefix mismatch) without needing a
  # live external service. See `talon-mcp-functional.test.ts`.
  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build stub claude SEA binary (Windows)
        if: runner.os == 'Windows'
        run: npm run build:stub-sea

      - name: Run MCP-functional integration tests
        run: npm run test:integration

      - name: Integration summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs integration-results.json "Integration (${{ matrix.os }})"

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.os }}
          path: integration-results.json
          retention-days: 14

  # ── Compiled-binary smoke (all OSes) ───────────────────────────
  # Compiles Talon to a standalone bun binary on every supported OS and
  # smoke-tests the REAL artifact from an isolated directory with no
  # source tree on disk — the install shape a published binary ships as.
  # Proves: prompts + version travel inside the binary (not read from a
  # missing source tree), the CLI boots (--version / --help / doctor),
  # and the MCP supervisor self-reinvocation (`_mcp-launch`) works
  # compiled. The prompt-manifest drift guard lives in the test job
  # (prompts-embed.test.ts), same as the SQL embed.
  compile-smoke:
    name: Compile Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Compile standalone binary
        # The user-facing CLI entry (src/cli.ts) — same dispatcher the npm
        # `talon` bin runs — not src/index.ts (the daemon that eagerly
        # boots the agent). bun appends `.exe` on Windows.
        # build:prompts first: the embedded-prompts manifest is committed
        # and drift-guarded, but regenerating right before compile makes
        # the binary immune to a stale manifest regardless.
        shell: bash
        run: |
          npm run build:prompts
          bun build --compile src/cli.ts --outfile "$RUNNER_TEMP/talon"

      - name: CLI smoke (version / help / doctor) from an isolated cwd
        shell: bash
        run: |
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          BIN="$RUNNER_TEMP/talon$ext"
          # Run from a directory with no prompts/ or package.json on disk:
          # anything the binary needs must be embedded.
          # Read the expected version BEFORE leaving the workspace, via a
          # relative path — a Windows $GITHUB_WORKSPACE (D:\a\talon\talon)
          # interpolated into a JS string mangles its backslashes (\t, \a).
          expected=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP"
          ver=$("$BIN" --version)
          echo "version: $ver (expected $expected)"
          [[ "$ver" == "$expected" ]] || { echo "::error::--version printed '$ver', expected '$expected'"; exit 1; }
          "$BIN" --help | grep -q "Talon" || { echo "::error::--help missing banner"; exit 1; }
          # doctor exits non-zero without a config (no config file is a
          # "fail" check), so tolerate that and assert on the embedded
          # prompt-template check instead — that line only prints if the
          # embedded prompts loaded.
          out=$("$BIN" doctor || true)
          echo "$out"
          echo "$out" | grep -q "Prompt templates loaded" \
            || { echo "::error::embedded prompts did not load in the compiled binary"; exit 1; }

      - name: Supervisor sanity (_mcp-launch supervises a child)
        # Unix only: Git Bash on Windows shadows `timeout` with the
        # incompatible Windows timeout.exe. The supervisor's Windows
        # process path is exercised by the warden/Job-Object tests.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ext=""
          BIN="$RUNNER_TEMP/talon$ext"
          # `timeout` is GNU coreutils — present on ubuntu, often absent on
          # macOS runners; fall back to running without it (the closing
          # pipe gives `cat` EOF, so the supervisor exits on its own).
          run_to() { if command -v timeout >/dev/null 2>&1; then timeout "$@"; else shift; "$@"; fi; }
          # Hold stdin open briefly: closing it instantly can SIGTERM the
          # child before the line round-trips through the supervisor.
          out=$({ echo '{"jsonrpc":"2.0","id":1,"method":"ping"}'; sleep 2; } | run_to 30 "$BIN" _mcp-launch cat)
          echo "supervisor stdout: $out"
          [[ "$out" == *'"method":"ping"'* ]] || { echo "::error::JSON line did not pass through supervisor"; exit 1; }
          err=$({ echo 'plain banner line'; sleep 2; } | run_to 30 "$BIN" _mcp-launch cat 2>&1 >/dev/null)
          echo "supervisor stderr: $err"
          [[ "$err" == *'mcp-launcher: stdout'* ]] || { echo "::error::non-JSON line was not rerouted to stderr"; exit 1; }

  # ── Gleam artifact drift guard ─────────────────────────────────
  # The scheduler decision core is Gleam compiled to JS with the
  # artifacts committed under src/native/. Rebuild from source and fail
  # if the committed artifacts drifted.
  gleam-artifact:
    name: Gleam Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install gleam
        run: |
          mkdir -p "$HOME/.gleam-bin"
          curl -fsSL https://github.com/gleam-lang/gleam/releases/download/v1.17.0/gleam-v1.17.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/gleam.tgz
          tar -xzf /tmp/gleam.tgz -C "$HOME/.gleam-bin"
          echo "$HOME/.gleam-bin" >> "$GITHUB_PATH"
          "$HOME/.gleam-bin/gleam" --version

      - name: Rebuild and check drift
        run: |
          (cd native/scheduler-core && gleam build --target javascript && node embed.mjs)
          git diff --exit-code src/native/

  # ── Zig toolchain artifact drift guard ─────────────────────────
  # textops builds through the pinned zig toolchain
  # (native/.zig-version — codegen changes between releases, so the
  # version is part of the artifact contract), embedded as base64
  # under src/native/. Rebuild it from source and fail if the
  # committed bytes drifted.
  zig-artifact:
    name: Zig Toolchain Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: ~/.zig-bin
          key: zig-${{ runner.os }}-${{ hashFiles('native/.zig-version') }}

      - name: Install zig (pinned)
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          ZIG_VERSION="$(cat native/.zig-version)"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.zig-bin"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig-bin" --strip-components=1

      - name: Add zig to PATH
        run: |
          echo "$HOME/.zig-bin" >> "$GITHUB_PATH"
          "$HOME/.zig-bin/zig" version

      - name: Rebuild and check drift
        run: |
          npm run build:zig
          git diff --exit-code src/native/textops-wasm-bytes.ts

      # The talon-driver launcher is a native per-arch binary (not an
      # embedded artifact), so there is nothing to drift-check — instead
      # cross-compile the whole distribution matrix as a build guard, so
      # a source change that breaks any target arch fails here.
      - name: Cross-compile the launcher (all targets)
        run: npm run build:driver:all

      # Run the launcher's behavior suite here — this is the only job with
      # the pinned zig toolchain, so it's where the build-and-drive tests
      # in src/__tests__/talon-driver.test.ts actually execute (elsewhere
      # they self-skip when zig is absent).
      - name: Driver behavior tests
        run: |
          npm ci
          npx vitest run src/__tests__/talon-driver.test.ts

  # ── WASM artifact reproducibility ──────────────────────────────
  # The Rust wasm crates (native/blake3-wasm, native/strsim-wasm,
  # native/sqlguard-wasm, native/htmlents-wasm) are committed alongside
  # their built artifacts, embedded as base64 under src/native/.
  # Rebuild from source and diff: if any committed bytes drift from the
  # committed Rust source (or someone hand-edits a generated module),
  # this fails. Toolchains are pinned per-crate by rust-toolchain.toml
  # so rustc codegen drift can't break the diff. Runs on the runner's own
  # node (embed.mjs uses only builtins) — independent of the repo's Node
  # version matrix.
  wasm-artifact:
    name: WASM Artifact Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/blake3-wasm
            native/strsim-wasm
            native/sqlguard-wasm
            native/htmlents-wasm

      - name: Rebuild wasm + regenerate embedded bytes
        run: npm run build:wasm

      - name: Committed bytes must match committed Rust source
        run: |
          git diff --exit-code \
            src/native/blake3-wasm-bytes.ts \
            src/native/strsim-wasm-bytes.ts \
            src/native/sqlguard-wasm-bytes.ts \
            src/native/htmlents-wasm-bytes.ts

  # ── Warden supervision harness ─────────────────────────────────
  # talon-warden (native/talon-warden) is a native per-arch Rust binary
  # like the launcher — nothing to drift-check. Build it with the pinned
  # toolchain (rust-toolchain.toml), run its unit tests, then run the
  # behavior suite plus the trigger supervisor suites over the real
  # binary — this is the job of record for the warden supervision path
  # (elsewhere the warden tests self-skip when cargo is absent, and the
  # trigger suites run the TS fallback). All three OSes: process groups +
  # pdeathsig vs ppid-polling (Unix) vs kill-on-close Job Objects
  # (Windows) are exactly the things that differ. The bash/signal
  # behaviour suite + trigger supervisor suites run on Unix; Windows runs
  # the cmd-based warden smoke suite over the real talon-warden.exe.
  warden:
    name: Warden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/talon-warden

      - name: Unit tests (pinned toolchain via rust-toolchain.toml)
        run: cargo test --locked
        working-directory: native/talon-warden

      - name: Build the harness
        run: npm run build:warden

      - name: Warden behavior + trigger supervisor suites (warden path)
        if: runner.os != 'Windows'
        run: |
          npm ci
          npx vitest run src/__tests__/talon-warden.test.ts \
            src/__tests__/triggers.test.ts \
            src/__tests__/triggers-extended.test.ts

      - name: Warden smoke suite (Windows, Job Object path)
        if: runner.os == 'Windows'
        run: |
          npm ci
          npx vitest run src/__tests__/talon-warden.test.ts

  # ── Blake3 napi addon ──────────────────────────────────────────
  # blake3-napi (native/blake3-napi) is a per-arch .node library like
  # the warden is a per-arch binary — nothing to drift-check. Build it
  # with the pinned toolchain, run its unit tests, then drive the real
  # artifact through the TS boundary: digest agreement with the wasm
  # twin, fallback modes, and the media-index consumer. This is the job
  # of record for the native hashing path (elsewhere the napi tests
  # self-skip when cargo is absent and hashing uses the wasm fallback).
  # All three OSes: cdylib loading and mmap behaviour differ, and the
  # addon must prove it builds + loads on the Windows MSVC toolchain
  # rather than silently riding the wasm fallback there.
  napi:
    name: Blake3 Napi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/blake3-napi

      - name: Unit tests (pinned toolchain via rust-toolchain.toml)
        run: cargo test --locked
        working-directory: native/blake3-napi

      - name: Build the addon
        run: npm run build:napi

      - name: Addon behavior + wasm parity + media-index consumer
        # Pin to a single persistent fork. These three files load the
        # native blake3 .node addon and a real better-sqlite3 handle;
        # under vitest's default multi-fork pool the per-file worker
        # churn intermittently dies with "Worker exited unexpectedly"
        # (the tests themselves pass first). One fork, run sequentially,
        # removes the concurrent native-addon load/teardown that causes
        # the flake without changing any test logic.
        # shell: bash so the multi-line `\` continuations run identically
        # on Windows (the default shell there is pwsh, which breaks on `\`).
        shell: bash
        run: |
          npm ci
          npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1 \
            src/__tests__/blake3-napi.test.ts \
            src/__tests__/blake3-wasm.test.ts \
            src/__tests__/media-index.test.ts

  # ── Namespace FUSE addon ───────────────────────────────────────
  # talon-fusefs (native/talon-fusefs) is a per-arch .node library like
  # blake3-napi — nothing to drift-check. Build it with the pinned
  # toolchain, run its unit tests, then drive the REAL artifact through
  # a live kernel mount: symlink serving, live synthetic reads from
  # this process and from child processes, EROFS/ENOENT, and clean
  # unmount. TALON_REQUIRE_FUSE_LIVE=1 turns a silent capability skip
  # into a failure, so this job can never go green without mounting.
  # Linux only — the addon mounts through fusermount, a Linux facility;
  # every other host runs the (also tested) fuseless degradation path.
  fusefs:
    name: Namespace FUSE (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/talon-fusefs

      # A version banner is not a mount. The old check only proved
      # /dev/fuse existed and fusermount3 could print --version, so a
      # runner that had lost the *permission* to mount still walked past
      # it and surfaced as an opaque assertion failure in the live suite
      # (2026-07-29: "fusermount3: mount failed: Operation not permitted"
      # on ubuntu-latest, with this step green). Probe the capability
      # itself, and print the state a human needs to tell an environment
      # regression from a code regression.
      #
      # The cause, found by this probe on 2026-07-30: GitHub's runner
      # fleet is not uniform. Some images carry a self-built libfuse in
      # /usr/local/bin, which precedes /usr/bin on PATH:
      #
      #   passing runner: /usr/bin/fusermount3        3.14.0  -rwsr-xr-x root
      #   failing runner: /usr/local/bin/fusermount3  3.18.2  -rwxrwxrwx runner
      #
      # An unprivileged user cannot mount FUSE through a fusermount3 that
      # is not setuid root — the kernel refuses, and libfuse reports it as
      # "Operation not permitted". fuser is built default-features = false,
      # so it shells out to whichever fusermount3 PATH resolves; land on an
      # image with the impostor and the mount cannot succeed. Nothing
      # intermittent about it, and nothing to do with AppArmor: the
      # apparmor_restrict_unprivileged_userns knob is 1 on both, and
      # A/B-ing it (same commit, job matrixed over setting it to 0) passed
      # on both legs. Don't reintroduce that workaround.
      #
      # So: probe, then guarantee. If the resolved binary isn't setuid
      # root, put the system one back in front rather than failing on a
      # runner that is perfectly capable of mounting.
      - name: Host FUSE capability (probe, then guarantee setuid fusermount3)
        run: |
          set -x
          test -e /dev/fuse
          ls -l /dev/fuse
          id
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
          aa-enabled 2>/dev/null || true

          set +x
          resolved="$(command -v fusermount3 || command -v fusermount || true)"
          if [ -z "$resolved" ]; then
            echo "::error::no fusermount3/fusermount on PATH"
            exit 1
          fi
          echo "resolved: $resolved"
          ls -l "$resolved"
          "$resolved" --version || true

          setuid_root() {
            [ -u "$1" ] && [ "$(stat -c %u "$1")" = "0" ]
          }

          if setuid_root "$resolved"; then
            echo "ok: $resolved is setuid root"
          elif setuid_root /usr/bin/fusermount3; then
            echo "::warning::$resolved is $(stat -c '%A %U:%G' "$resolved"), not setuid root; prepending /usr/bin so the setuid system binary wins"
            echo "/usr/bin" >> "$GITHUB_PATH"
            ls -l /usr/bin/fusermount3
          else
            echo "::error::no setuid-root fusermount3 on this host ($resolved is $(stat -c '%A %U:%G' "$resolved")). An unprivileged FUSE mount cannot succeed: runner-image problem, not a code regression."
            exit 1
          fi

      - name: Unit tests (pinned toolchain via rust-toolchain.toml)
        run: cargo test --locked
        working-directory: native/talon-fusefs

      - name: Build the addon
        run: npm run build:fusefs

      - name: Live mount + degradation + namespace suites
        env:
          TALON_REQUIRE_FUSE_LIVE: "1"
        run: |
          npm ci
          npx vitest run --pool=forks --no-file-parallelism --maxWorkers=1 \
            src/__tests__/fusefs-live.test.ts \
            src/__tests__/vfs-fusefs.test.ts \
            src/__tests__/vfs.test.ts \
            src/__tests__/vfs-rewrite.test.ts \
            src/__tests__/vfs-nsdir.test.ts \
            src/__tests__/native-vfs-address.test.ts

  # ── Real backend live integration tier ───────────────────────
  # Installs the real backend CLI, then exercises the deployed backend surface
  # that fixture tests cannot fully represent: Kilo/OpenCode live HTTP model
  # discovery and Claude Code's real SDK subprocess/model-discovery bridge.
  backend-live:
    name: Backend Live (${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Live model discovery is primarily a backend/schema contract.
          # Run the full matrix on POSIX where the provider servers are
          # stable and fast.
          - os: ubuntu-latest
            backend: kilo
          - os: ubuntu-latest
            backend: opencode
          - os: ubuntu-latest
            backend: claude
          - os: ubuntu-latest
            backend: codex
          - os: ubuntu-latest
            backend: openai-agents
          - os: macos-latest
            backend: kilo
          - os: macos-latest
            backend: opencode
          - os: macos-latest
            backend: claude
          - os: macos-latest
            backend: codex
          - os: macos-latest
            backend: openai-agents
          # Windows runners are consistently slower and flakier for the
          # long-lived provider-server CLIs. Keep Windows coverage where it
          # catches real Windows-specific process resolution: subprocess
          # backends that execute installed CLI binaries directly. The
          # broader Windows process/MCP coverage remains in the unit,
          # functional, and integration tiers above.
          - os: windows-latest
            backend: claude
          - os: windows-latest
            backend: codex
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install backend CLI
        run: node .github/scripts/install-backend-cli.mjs ${{ matrix.backend }}

      - name: Run backend live tests
        run: npm run test:${{ matrix.backend }}:backend
        env:
          CLAUDE_LIVE_REQUIRED: "1"
          KILO_LIVE_REQUIRED: "1"
          OPENCODE_LIVE_REQUIRED: "1"
          CODEX_LIVE_REQUIRED: "1"

      - name: Backend live summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs ${{ matrix.backend }}-backend-results.json "Backend Live (${{ matrix.backend }}, ${{ matrix.os }})"

      - name: Upload backend live results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-live-${{ matrix.backend }}-${{ matrix.os }}
          path: ${{ matrix.backend }}-backend-results.json
          retention-days: 14

  # ── Fuzz testing (property-based with fast-check) ─────────────
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run fuzz tests (extended iterations)
        run: npx vitest run --reporter=verbose --reporter=json --outputFile=fuzz-results.json src/__tests__/fuzz.test.ts
        env:
          FAST_CHECK_NUM_RUNS: "10000"

      - name: Fuzz summary
        if: always()
        run: node .github/scripts/vitest-summary.mjs fuzz-results.json "Fuzz Test Results (10,000 iterations/property)"

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-results
          path: fuzz-results.json
          retention-days: 14

  # ── Security audit ────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit dependencies
        # --package-lock-only audits straight from the lockfile — the
        # advisory check doesn't need a node_modules install.
        run: npm audit --audit-level=critical --package-lock-only

  # ── Secret scanning ───────────────────────────────────────────
  # Catches hardcoded credentials anywhere in the working tree —
  # API keys, bot tokens, .env files committed by accident, OAuth
  # secrets in configs, private keys. Runs on every push + PR.
  # Runs gitleaks directly rather than via gitleaks-action so the scanned
  # SCOPE is pinned and printed — see the comment on the scan step.
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs full history to scan past commits — shallow checkout
          # would only catch leaks in the latest commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan this ref's own history
        run: |
          # THE SCOPE IS THE POINT.
          #
          # gitleaks-action picks the commit range for you, and the range it
          # picks is not stable: on a plain push it walks `--all` — every ref
          # the runner fetched, including commits on unmerged PR branches and
          # even orphaned ones left behind by a rebase; on other pushes it ran
          # `--log-opts=-1`, i.e. a single commit. Both are reported the same
          # way, so a green told you nothing about what was actually scanned.
          #
          # That coupling is not theoretical: on 2026-07-30 main went red over
          # a test fixture in commit 819c7473, which is not an ancestor of main
          # and no longer exists on any branch (#688). main's health should not
          # depend on other people's in-flight work.
          #
          # `--log-opts=HEAD` scans exactly the checked-out ref's own history:
          # main's history on a push to main, base + PR commits on the
          # pull_request merge ref. Nothing else. The commit count gitleaks
          # prints is then a meaningful statement about what passed.
          /tmp/gitleaks detect --source . --log-opts=HEAD \
            --redact --verbose --no-banner --exit-code 1

  # ── Dependency review (PR-only) ───────────────────────────────
  # On every PR, GitHub's dependency-review-action diffs lockfile changes
  # against the GitHub Advisory Database — any newly-introduced dep with a
  # known CVE fails the gate. Catches Dependabot PRs that bump TO a
  # vulnerable version (rare but happens) and human PRs that add risky deps.
  dep-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # ── Lockfile portability ──────────────────────────────────────
  # Catches the Dependabot transitive-vuln pattern: a wide
  # `npm install --include=optional` produces a lockfile that only
  # validates with the flag set, breaking CI's plain `npm ci`. The
  # other test jobs run `npm ci` in the source tree where node_modules
  # state could mask issues — this job copies ONLY package.json +
  # package-lock.json to a fresh tmpdir and runs `npm ci` there.
  # Same logic as Talon's local `tools/verify-lockfile.sh`.
  lockfile:
    name: Lockfile Portability
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Note: NO cache — fresh tmpdir means no cached node_modules
          # state can paper over portability bugs.

      - name: Verify package-lock.json portability
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          cp package.json package-lock.json "$tmpdir/"
          # Skip postinstall scripts — those need files outside
          # package.json/lock that wouldn't be present in the tmpdir.
          # The check is purely "does the lockfile resolve all deps"
          # not "does the full build run."
          (cd "$tmpdir" && npm ci --ignore-scripts --no-audit --foreground-scripts)
          echo "::notice::package-lock.json is portable"

  # ── Docker build validation ───────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Tarball / publish dry-run ─────────────────────────────────
  # `npm pack --dry-run` would just list files. Our custom checker
  # *additionally* asserts on the contents — no .env, no test fixtures,
  # no source maps, no sshkeys, total size under the ceiling, README +
  # package.json present. Catches publish-time regressions before they
  # ship a leaky tarball to npm.
  tarball:
    name: Tarball Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate npm tarball contents
        # `npm pack` reads package.json files[] from the source tree and
        # the checker uses only node builtins — no install needed.
        run: npm run tarball:check

  # ── Final status gate ─────────────────────────────────────────
  # All required jobs MUST pass for `CI Status` to be green. Branch
  # protection (`.github/branch-protection.json`) gates merges on this
  # single check, so adding a new required job means adding it here too.
  ci-ok:
    name: CI Status
    if: always()
    needs:
      - pr-title
      - quality
      - test
      - functional-cross-platform
      - integration
      - compile-smoke
      - gleam-artifact
      - zig-artifact
      - wasm-artifact
      - warden
      - napi
      - backend-live
      - fuzz
      - security
      - secrets
      - lockfile
      - docker
      - tarball
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check required jobs
        env:
          # Single source of truth: every job in the `needs` list above
          # is checked automatically — no second hand-written list to
          # forget when adding a job. (Jobs skipped by their `if` are
          # fine; dep-review is PR-only, for example.)
          NEEDS: ${{ toJSON(needs) }}
        run: |
          fail=0
          while IFS=$'\t' read -r name result; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Job '$name' failed (result=$result)"
              fail=1
            fi
          done < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          if [[ $fail -eq 1 ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality | ${{ needs.quality.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Functional | ${{ needs.functional-cross-platform.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WASM Artifact | ${{ needs.wasm-artifact.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Live | ${{ needs.backend-live.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzz | ${{ needs.fuzz.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.secrets.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lockfile | ${{ needs.lockfile.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tarball | ${{ needs.tarball.result == 'success' && 'pass' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
