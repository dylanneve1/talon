# Merge-queue substitute.
#
# GitHub's native merge queue requires an organization-owned repository;
# this repo is user-owned, so we emulate the queue with the pieces we
# do have:
#
#   1. Branch protection requires "CI Status" on an UP-TO-DATE branch
#      (strict checks) — so merges serialize against main by definition.
#   2. PRs opt into the queue with `gh pr merge --auto` (auto-merge).
#   3. This workflow advances the queue: every time main moves, it merges
#      main into each open auto-merge PR and pushes the update with a real
#      user PAT. That push fires the PR's normal `pull_request` CI run, so
#      the required "CI Status" check is produced on the new head and
#      GitHub's auto-merge can complete once it's green.
#
# Why a real PAT push, not `pulls.updateBranch` + `workflow_dispatch`:
# branch updates made with the built-in GITHUB_TOKEN deliberately do NOT
# fire `pull_request` events (Actions' recursion guard), which left a
# freshly-updated branch up-to-date but with no required-check run — stuck
# forever. Re-dispatching ci.yml via `workflow_dispatch` was a workaround,
# but a `workflow_dispatch` run does not satisfy the branch-protection
# required status check, so it stayed BLOCKED anyway. A real push from a
# user token fires CI the normal way, exactly like a human pushing a
# branch update — no recursion guard, no extra approval gate.
#
# Green CI lets GitHub auto-merge complete the squash; that push to main
# re-runs this workflow, lining up the next PR. Conflicting PRs are
# skipped with a warning and need a manual rebase.

name: Merge Queue

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merge-queue
  cancel-in-progress: false

jobs:
  advance:
    name: Advance queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # PAT (not GITHUB_TOKEN) so the branch-update push fires CI.
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Update auto-merge PR branches with a real push
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          git config user.name "claudiusthebot"
          git config user.email "claudiusthebot@users.noreply.github.com"
          git fetch origin main --quiet

          # Oldest-first so the queue serialises against main deterministically.
          mapfile -t entries < <(
            gh pr list --repo "$REPO" --state open --base main \
              --json number,headRefName,autoMergeRequest \
              --jq 'sort_by(.number)[] | select(.autoMergeRequest != null) | "\(.number)\t\(.headRefName)"'
          )
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "No auto-merge PRs queued."
            exit 0
          fi

          for entry in "${entries[@]}"; do
            num="${entry%%$'\t'*}"
            branch="${entry#*$'\t'}"
            git fetch origin "$branch" --quiet \
              || { echo "::warning::#${num}: fetch ${branch} failed"; continue; }

            # Skip if the branch already contains every commit on main
            # (it already has, or is running, its own pull_request CI).
            if [ -z "$(git rev-list "origin/${branch}..origin/main")" ]; then
              echo "#${num} (${branch}): already up to date with main"
              continue
            fi

            git checkout -q -B _queue "origin/${branch}"
            if git merge --no-edit origin/main >/dev/null 2>&1; then
              if git push origin "HEAD:${branch}" --quiet; then
                echo "#${num} (${branch}): merged main and pushed — pull_request CI will run"
              else
                echo "::warning::#${num} (${branch}): push failed"
              fi
            else
              git merge --abort || true
              echo "::warning::#${num} (${branch}): conflicts with main — needs a manual rebase; skipping"
            fi
          done
