name: Antigravity Live Tests

# Live-tier integration test for the Antigravity backend. Off the
# regular CI path because it (a) requires `google-antigravity` to be
# installable from PyPI (depends on a 126MB Linux x86-64 binary
# shipped inside the wheel) and (b) requires a real GEMINI_API_KEY
# to actually dispatch a Gemini call.
#
# Triggered manually via `workflow_dispatch`. The repo secret used:
#   - GEMINI_API_KEY: a Gemini API key (get one at aistudio.google.com).
#
# If the secret is missing the suite exits cleanly via `describe.skipIf`.
# To make a missing secret fail the run instead of skipping, set
# `ANTIGRAVITY_LIVE_REQUIRED=1` in the env block.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (default: current branch)"
        required: false
        default: ""

concurrency:
  # One job at a time — concurrent runs share the same API key.
  group: antigravity-live-tests
  cancel-in-progress: false

jobs:
  live-antigravity:
    name: Live Antigravity integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Install google-antigravity in a dedicated venv
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.talon-antigravity"
          python3 -m venv "$HOME/.talon-antigravity/venv"
          "$HOME/.talon-antigravity/venv/bin/pip" install --upgrade pip
          "$HOME/.talon-antigravity/venv/bin/pip" install google-antigravity
          "$HOME/.talon-antigravity/venv/bin/python3" -c \
            "import google.antigravity as ag; print('antigravity OK:', ag.__file__)"
          # Provision the workspace so localharness can read+write it.
          mkdir -p "$HOME/talon-antigravity-workspace"

      - name: Run live Antigravity suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Make a missing key fail the run loudly instead of silently
          # skipping. Comment out if you want the workflow to be tolerant.
          ANTIGRAVITY_LIVE_REQUIRED: "1"
        run: |
          npx vitest run \
            src/__tests__/integration/antigravity-live.test.ts \
            --reporter=verbose
