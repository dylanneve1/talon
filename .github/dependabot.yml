version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    # 0.3.198–0.3.200 ship a broken sdk.d.ts: SDKMessage references
    # undeclared union members, collapsing the type to `any` and failing
    # `tsc --noEmit`. Drop this once a fixed release is out.
    ignore:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
        versions: ["0.3.198 - 0.3.200"]
    reviewers:
      - "dylanneve1"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
