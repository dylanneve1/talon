version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # 0.3.198–0.3.200 ship a broken sdk.d.ts: SDKMessage references
      # undeclared union members, collapsing the type to `any` and failing
      # `tsc --noEmit`. Drop this once a fixed release is out.
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
        versions: ["0.3.198 - 0.3.200"]
      # `openai` must stay on the major that @openai/agents-openai depends on
      # (^7.2.0 as of agents 0.16.0) — a solo major bump here installs a
      # *second* nested openai under it, and the two `OpenAI` classes are
      # structurally incompatible (private-field brand), so
      # setDefaultOpenAIClient() fails `tsc --noEmit` with TS2345. Bump the
      # major by hand together with the agents SDK.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "dylanneve1"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
