services:
  talon:
    build:
      context: .
      # RUNTIME=node builds the Node 24 + tsx fallback image instead of
      # the default Bun one. Both use HOME=/home/bun, so the mounts below
      # are identical either way.
      args:
        RUNTIME: bun
    restart: unless-stopped
    volumes:
      # Talon's persistent home: config, sessions, workspace, palace, userbot session.
      # Container's HOME=/home/bun (the oven/bun image's UID-1000 user), so
      # this must land at /home/bun/.talon.
      - ${HOME}/.talon:/home/bun/.talon
      # Claude Code credentials. The Agent SDK spawns claude as a subprocess and
      # reads $HOME/.claude/.credentials.json — mount the host's auth at the
      # container user's HOME, not /root, since we run as an unprivileged user.
      #
      # Two bootstrap paths, both work with this rw mount:
      #  1. You already ran `claude auth login` on the host: existing
      #     ~/.claude/.credentials.json is reused inside the container.
      #  2. Fresh setup, no host install: `docker compose exec talon bash` then
      #     `claude auth login` — paste the OAuth URL into your host browser,
      #     paste the code back, and creds land in this mount. (The image's
      #     `claude` is the CLI the Agent SDK ships, linked onto PATH.)
      # Don't add :ro here — path 2 needs writes to land the OAuth callback,
      # and Claude Code rotates its session/projects state inside this dir.
      - ${HOME}/.claude:/home/bun/.claude
    environment:
      - NODE_ENV=production
      # First boot only: with no ~/.talon/config.json yet, the entrypoint
      # writes one from these (docker/seed-config.mjs lists them all) and
      # ignores them afterwards. With none set it starts the native bridge.
      # - TALON_BOT_TOKEN=123456:ABC...
      # - TALON_ADMIN_USER_ID=123456789
      # - TALON_BACKEND=claude
      # - TALON_BRIDGE_URL=https://my-host.lan:19880
    # Publish the native bridge for the companion app / talon-node devices:
    # ports:
    #   - "19880:19880"
    # Optional: ANTHROPIC_API_KEY etc. as a fallback to OAuth-via-credentials.json.
    # Uncomment and create .env if you want to auth via API key instead of Claude Max.
    # env_file: .env
    mem_limit: 1g
    cpus: "1.0"
