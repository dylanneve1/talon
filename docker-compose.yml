services:
  talon:
    build: .
    restart: unless-stopped
    volumes:
      # Talon's persistent home: config, sessions, workspace, palace, userbot session.
      # Container's HOME=/home/node, so this must land at /home/node/.talon.
      - ${HOME}/.talon:/home/node/.talon
      # Claude Code credentials. The Agent SDK spawns claude as a subprocess and
      # reads $HOME/.claude/.credentials.json — mount the host's auth at the
      # container user's HOME, not /root, since we run as the node user.
      # Read-only is enough; the SDK only reads creds at startup.
      - ${HOME}/.claude:/home/node/.claude:ro
    environment:
      - NODE_ENV=production
    # Optional: ANTHROPIC_API_KEY etc. as a fallback to OAuth-via-credentials.json.
    # Uncomment and create .env if you want to auth via API key instead of Claude Max.
    # env_file: .env
    mem_limit: 1g
    cpus: "1.0"
